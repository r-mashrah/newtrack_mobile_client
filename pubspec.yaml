name: newtrack_mobile_client
description: "NewTrack Mobile Client - GPS Tracking and Fleet Management Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI and Material Design
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296

  # State Management and Routing
  flutter_riverpod: ^2.4.10
  go_router: ^17.0.1

  # HTTP and Networking
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0

  # JSON Serialization
  json_annotation: ^4.8.1

  # Image Handling
  image_picker: ^1.0.7
  image_cropper: ^11.0.0

  # Maps
  google_maps_flutter: ^2.5.3
  location: ^5.0.3

  # Firebase
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0

  # Local Database
  isar: ^3.1.0+1

  # Utilities
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  logger: ^2.2.0
  connectivity_plus: ^7.0.0
  freezed_annotation: ^2.4.4
  uuid: ^4.5.2
  geocoding: ^4.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  freezed:
  build_runner: ^2.4.13
  json_serializable: ^6.7.1
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/l10n/
    - assets/images/
  #   - assets/icons/
  #   - assets/fonts/

  # fonts:
  #   - family: OpenSans
  #     fonts:
  #       - asset: assets/fonts/OpenSans-Regular.ttf
  #       - asset: assets/fonts/OpenSans-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/OpenSans-SemiBold.ttf
  #         weight: 600
